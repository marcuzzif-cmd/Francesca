<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Invitación Francesca 5 años</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;700;900&family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0a0015;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: 'Quicksand', sans-serif;
    overflow: auto;
  }

  /* Partículas de fondo */
  .particles {
    position: fixed;
    width: 100%; height: 100%;
    top: 0; left: 0;
    pointer-events: none;
    z-index: 0;
  }
  .particle {
    position: absolute;
    border-radius: 50%;
    animation: float linear infinite;
  }

  @keyframes float {
    0% { transform: translateY(100vh) scale(0); opacity: 0; }
    10% { opacity: 1; }
    90% { opacity: 1; }
    100% { transform: translateY(-10vh) scale(1); opacity: 0; }
  }

  /* Tarjeta */
  .card {
    position: relative;
    width: 420px;
    min-height: auto;
    border-radius: 32px;
    overflow: hidden;
    z-index: 10;
    animation: cardIn 1s cubic-bezier(0.34, 1.56, 0.64, 1) both;
  }

  @keyframes cardIn {
    from { transform: scale(0.7) translateY(60px); opacity: 0; }
    to { transform: scale(1) translateY(0); opacity: 1; }
  }

  /* Borde holográfico animado */
  .card::before {
    content: '';
    position: absolute;
    inset: -3px;
    border-radius: 34px;
    background: conic-gradient(
      from var(--angle, 0deg),
      #ff2d78, #ff9de2, #c084fc, #60a5fa, #34d399, #fbbf24, #ff2d78
    );
    z-index: -1;
    animation: spin 4s linear infinite;
  }

  @property --angle {
    syntax: '<angle>';
    initial-value: 0deg;
    inherits: false;
  }

  @keyframes spin {
    to { --angle: 360deg; }
  }

  .card-inner {
    background: linear-gradient(160deg, #12003a 0%, #1a0050 40%, #0d0030 100%);
    border-radius: 30px;
    padding: 20px 22px 20px;
    height: 100%;
    position: relative;
    overflow: auto;
  }

  /* Patrón geométrico K-Pop de fondo */
  .card-inner::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image:
      radial-gradient(circle at 20% 20%, rgba(255,45,120,0.15) 0%, transparent 50%),
      radial-gradient(circle at 80% 80%, rgba(192,132,252,0.15) 0%, transparent 50%),
      radial-gradient(circle at 80% 20%, rgba(96,165,250,0.1) 0%, transparent 40%);
    pointer-events: none;
  }

  /* Estrellas decorativas */
  .stars {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 100%;
    pointer-events: none;
  }
  .star {
    position: absolute;
    color: #fff;
    font-size: 10px;
    animation: twinkle 2s ease-in-out infinite alternate;
    opacity: 0.6;
  }
  @keyframes twinkle {
    from { opacity: 0.2; transform: scale(0.8); }
    to { opacity: 1; transform: scale(1.2); }
  }

  /* Badge K-POP */
  .kpop-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: linear-gradient(135deg, #ff2d78, #c084fc);
    border-radius: 20px;
    padding: 5px 14px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 2px;
    color: #fff;
    margin-bottom: 8px;
    text-transform: uppercase;
    box-shadow: 0 0 20px rgba(255,45,120,0.5);
    animation: pulse 2s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 20px rgba(255,45,120,0.5); }
    50% { box-shadow: 0 0 35px rgba(255,45,120,0.8), 0 0 60px rgba(192,132,252,0.4); }
  }

  /* Foto frame */
  .photo-frame {
    position: relative;
    width: 160px;
    height: 180px;
    margin: 0 auto 20px;
  }

  .photo-ring {
    position: absolute;
    inset: -6px;
    border-radius: 50%;
    background: conic-gradient(#ff2d78, #c084fc, #60a5fa, #34d399, #fbbf24, #ff2d78);
    animation: spin 3s linear infinite;
  }

  .photo-ring-inner {
    position: absolute;
    inset: -3px;
    border-radius: 50%;
    background: #12003a;
  }

  .photo-circle {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    overflow: hidden;
    border: 3px solid #12003a;
    background: linear-gradient(135deg, #ff9de2, #c084fc, #60a5fa);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 70px;
    z-index: 2;
  }

  /* Decoraciones K-Pop tipo ídolo */
  .idol-decorations {
    position: absolute;
    inset: -20px;
    z-index: 3;
    pointer-events: none;
  }

  .idol-star {
    position: absolute;
    font-size: 18px;
    animation: orbitStar 4s linear infinite;
  }
  .idol-star:nth-child(1) { animation-delay: 0s; }
  .idol-star:nth-child(2) { animation-delay: -1s; }
  .idol-star:nth-child(3) { animation-delay: -2s; }
  .idol-star:nth-child(4) { animation-delay: -3s; }

  @keyframes orbitStar {
    0% { transform: rotate(0deg) translateX(95px) rotate(0deg); }
    100% { transform: rotate(360deg) translateX(95px) rotate(-360deg); }
  }

  /* Nombre principal */
  .name {
    font-family: 'Noto Serif KR', serif;
    font-size: 38px;
    font-weight: 900;
    text-align: center;
    line-height: 1;
    background: linear-gradient(135deg, #ff9de2 0%, #c084fc 40%, #60a5fa 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 4px;
    text-shadow: none;
    animation: nameGlow 3s ease-in-out infinite alternate;
    filter: drop-shadow(0 0 20px rgba(192,132,252,0.5));
  }

  @keyframes nameGlow {
    from { filter: drop-shadow(0 0 10px rgba(255,45,120,0.4)); }
    to { filter: drop-shadow(0 0 25px rgba(192,132,252,0.8)); }
  }

  .years-line {
    text-align: center;
    font-size: 15px;
    color: #ff9de2;
    letter-spacing: 4px;
    text-transform: uppercase;
    font-weight: 700;
    margin-bottom: 10px;
  }

  /* Divisor */
  .divider {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 10px 0;
  }
  .divider-line {
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, transparent, #c084fc, transparent);
  }
  .divider-icon { font-size: 18px; animation: spin 4s linear infinite; display: inline-block; }

  /* Texto invitación */
  .invite-text {
    text-align: center;
    color: rgba(255,255,255,0.75);
    font-size: 13.5px;
    line-height: 1.6;
    margin-bottom: 10px;
    font-weight: 600;
  }

  .invite-text strong {
    color: #ff9de2;
    font-weight: 700;
  }

  /* Info cards */
  .info-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 7px;
    margin-bottom: 10px;
  }

  .info-card {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(192,132,252,0.3);
    border-radius: 14px;
    padding: 8px 8px;
    text-align: center;
    backdrop-filter: blur(10px);
    transition: all 0.3s;
  }
  .info-card:hover {
    background: rgba(192,132,252,0.15);
    border-color: rgba(192,132,252,0.6);
    transform: translateY(-2px);
  }

  .info-icon { font-size: 22px; margin-bottom: 4px; display: block; }
  .info-label {
    font-size: 9px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #c084fc;
    font-weight: 700;
    margin-bottom: 2px;
  }
  .info-value {
    font-size: 13px;
    color: #fff;
    font-weight: 700;
    line-height: 1.3;
  }

  /* Dirección full width */
  .info-card.full {
    grid-column: 1 / -1;
  }



  /* Footer */
  .footer {
    text-align: center;
    font-size: 11px;
    color: rgba(255,255,255,0.35);
    letter-spacing: 1px;
  }

  .hearts {
    display: flex;
    justify-content: center;
    gap: 6px;
    margin-top: 10px;
  }
  .heart {
    font-size: 14px;
    animation: heartbeat 1.5s ease-in-out infinite;
  }
  .heart:nth-child(2) { animation-delay: 0.2s; }
  .heart:nth-child(3) { animation-delay: 0.4s; }
  .heart:nth-child(4) { animation-delay: 0.6s; }
  .heart:nth-child(5) { animation-delay: 0.8s; }

  @keyframes heartbeat {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.3); }
  }

  /* Glitter top */
  .glitter-bar {
    display: flex;
    justify-content: center;
    gap: 4px;
    margin-bottom: 10px;
  }
  .glitter-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    animation: glitter 1.5s ease-in-out infinite alternate;
  }
  .glitter-dot:nth-child(1) { background: #ff2d78; animation-delay: 0s; }
  .glitter-dot:nth-child(2) { background: #ff9de2; animation-delay: 0.15s; }
  .glitter-dot:nth-child(3) { background: #c084fc; animation-delay: 0.3s; }
  .glitter-dot:nth-child(4) { background: #60a5fa; animation-delay: 0.45s; }
  .glitter-dot:nth-child(5) { background: #34d399; animation-delay: 0.6s; }
  .glitter-dot:nth-child(6) { background: #fbbf24; animation-delay: 0.75s; }
  .glitter-dot:nth-child(7) { background: #c084fc; animation-delay: 0.9s; }
  .glitter-dot:nth-child(8) { background: #ff9de2; animation-delay: 1.05s; }
  .glitter-dot:nth-child(9) { background: #ff2d78; animation-delay: 1.2s; }

  @keyframes glitter {
    from { transform: scale(0.6); opacity: 0.4; }
    to { transform: scale(1.4); opacity: 1; }
  }

  /* Hero image guerreras */
  .guerreras-hero {
    position: relative;
    width: calc(100% + 56px);
    margin-left: -28px;
    height: 180px;
    overflow: hidden;
    margin-bottom: 8px;
    margin-top: -8px;
  }
  .guerreras-img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center top;
    display: block;
  }
  .guerreras-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(
      to bottom,
      rgba(18,0,58,0.3) 0%,
      transparent 30%,
      transparent 60%,
      rgba(18,0,58,0.95) 100%
    );
  }
  .guerreras-glow {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, #ff2d78, #c084fc, #60a5fa, #ff2d78);
    animation: glowBar 2s linear infinite;
    background-size: 200% 100%;
  }
  @keyframes glowBar {
    0% { background-position: 0% 0%; }
    100% { background-position: 200% 0%; }
  }

  /* Reproductor YouTube oculto */
  .yt-player {
    position: fixed;
    top: -9999px;
    left: -9999px;
    width: 1px;
    height: 1px;
  }

  /* Barra de música */
  .music-bar {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    background: rgba(255,45,120,0.12);
    border: 1px solid rgba(255,45,120,0.35);
    border-radius: 30px;
    padding: 8px 16px;
    margin-bottom: 14px;
    cursor: pointer;
    transition: all 0.3s;
  }
  .music-bar:hover {
    background: rgba(255,45,120,0.25);
    border-color: rgba(255,45,120,0.6);
  }
  .music-icon {
    font-size: 18px;
    animation: musicBounce 0.6s ease-in-out infinite alternate;
  }
  @keyframes musicBounce {
    from { transform: scale(1) rotate(-5deg); }
    to   { transform: scale(1.2) rotate(5deg); }
  }
  .music-label {
    font-size: 12px;
    color: #ff9de2;
    font-weight: 700;
    letter-spacing: 1px;
  }
  .music-waves {
    display: flex;
    align-items: center;
    gap: 2px;
  }
  .wave {
    width: 3px;
    border-radius: 2px;
    background: #ff9de2;
    animation: wave 0.8s ease-in-out infinite alternate;
  }
  .wave:nth-child(1) { height: 8px;  animation-delay: 0s; }
  .wave:nth-child(2) { height: 14px; animation-delay: 0.1s; }
  .wave:nth-child(3) { height: 10px; animation-delay: 0.2s; }
  .wave:nth-child(4) { height: 16px; animation-delay: 0.3s; }
  .wave:nth-child(5) { height: 8px;  animation-delay: 0.4s; }
  @keyframes wave {
    from { transform: scaleY(0.5); opacity: 0.6; }
    to   { transform: scaleY(1.3); opacity: 1; }
  }

  /* Botón WhatsApp */
  .whatsapp-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    background: linear-gradient(135deg, #25D366, #128C7E);
    border: none;
    border-radius: 30px;
    padding: 13px 20px;
    color: #fff;
    font-family: 'Quicksand', sans-serif;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 1px;
    cursor: pointer;
    margin-top: 6px;
    text-decoration: none;
    box-shadow: 0 4px 20px rgba(37,211,102,0.35);
    transition: all 0.3s;
  }
  .whatsapp-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 30px rgba(37,211,102,0.55);
  }
  .whatsapp-icon { font-size: 20px; }
</style>
</head>
